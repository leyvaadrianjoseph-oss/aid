<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toolbox | Python Garden</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pixel.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/reference.css">
</head>
<body data-role="user">
  <div id="app-nav"></div>
  <main class="container page-main">
    <div class="page-head"><h1>Python Toolbox</h1><p class="muted">A growing field guide to Python syntax, concepts, examples, and common mistakes.</p></div>
    <section class="toolbox-filters px-card" aria-label="Filter toolbox topics">
      <div class="px-field">
        <label class="px-label" for="search">Search topics</label>
        <input class="px-input" id="search" type="search" placeholder="Search loops, lists, errors..." autocomplete="off">
      </div>
      <div class="px-field">
        <label class="px-label" for="category-filter">Category</label>
        <select class="px-input" id="category-filter"><option value="">All categories</option></select>
      </div>
      <div class="px-field">
        <label class="px-label" for="difficulty-filter">Difficulty</label>
        <select class="px-input" id="difficulty-filter">
          <option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option>
        </select>
      </div>
    </section>
    <p id="topic-count" class="muted" role="status"></p>
    <div id="topics" class="topic-list"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/toolbox.js"></script>
</body>
</html>
